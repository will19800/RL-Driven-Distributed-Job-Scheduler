[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler-rl"
version = "0.0.0"
description = "Training tools for the RL-driven distributed job scheduler"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Will Chen" }]
dependencies = []

[project.scripts]
scheduler-rl = "scheduler_rl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scheduler_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
